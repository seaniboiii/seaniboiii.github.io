<!DOCTYPE html>
<html>

<head>
  <title>Word Warriors</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

  <!-- START SCREEN -->
  <div id="start-screen">

    <img src="assets/UI/play.png" id="playBtn">
    <img src="assets/UI/how.png" id="howBtn">

  </div>

  <!-- CHARACTER SCREEN -->
  <div id="character-screen" style="display:none;">

    <h1>CHOOSE YOUR WARRIOR</h1>

    <div id="characters">

      <div class="character" data-char="Woodcutter">
        <img src="assets/characters/Woodcutter/Woodcutter.png">
        <p>Woodcutter</p>
      </div>

      <div class="character" data-char="GraveRobber">
        <img src="assets/characters/GraveRobber/GraveRobber.png">
        <p>Grave Robber</p>
      </div>

      <div class="character" data-char="SteamMan">
        <img src="assets/characters/SteamMan/SteamMan.png">
        <p>Steam Man</p>
      </div>

    </div>

    <img src="assets/UI/confirm.png" id="confirm">
    <img src="assets/UI/back.png" id="backBtn2">

  </div>

  <!-- GAME SCREEN -->
  <div id="game" style="display:none;">

    <div id="enemy-sprite"></div>

    <h2 id="enemyName">Enemy</h2>

    <p id="quote"></p>
    <p id="question"></p>

    <textarea id="textAnswer" placeholder="Type your answer..."></textarea>
    <button id="submitText">Submit</button>

    <div id="answers">

      <button id="btnA" onclick="answer(0)"></button>
      <button id="btnB" onclick="answer(1)"></button>
      <button id="btnC" onclick="answer(2)"></button>
      <button id="btnD" onclick="answer(3)"></button>

    </div>

    <p id="result"></p>

    <div id="character-sprite"></div>

    <p>Player HP: <span id="playerHP">100</span></p>
    <p>Enemy HP: <span id="enemyHP">100</span></p>

  </div>

  <!-- HOW TO PLAY POPUP — must be at the bottom so it renders on top -->
  <div id="how-popup" class="popup hidden">

    <div class="popup-box">

      <span id="closeHow" class="close-btn">X</span>

      <h2>HOW TO PLAY</h2>

      <p>Analyze media language.</p>
      <p>Detect bias and implications.</p>
      <p>Correct answers damage enemies.</p>
      <p>Wrong answers damage you.</p>

    </div>

  </div>

  <!-- GAME OVER POPUP -->
  <div id="gameover-popup" class="popup hidden">
    <div class="popup-box">
      <h2>DEFEAT</h2>
      <p>Better luck next time...</p>
      <button onclick="tryAgain()">TRY AGAIN</button>
    </div>
  </div>

  <!-- WIN POPUP -->
  <div id="win-popup" class="popup hidden">
    <div class="popup-box">
      <h2>VICTORY!</h2>
      <p>All biomes conquered!</p>
      <button onclick="tryAgain()">PLAY AGAIN</button>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="game.js"></script>

</body>

</html>
